[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codegar"
version = "0.1.0"
description = "Architecture compiler that turns declarative application architecture into working software."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[project.scripts]
codegar = "codegar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
